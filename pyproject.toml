[project]
name = "dropzone-ingest"
version = "0.1.0"
description = "Exactly-once ingest of CSV and JSONL file drops into Postgres"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
dropzone = "dropzone.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dropzone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
